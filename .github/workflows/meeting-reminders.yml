name: Meeting report reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: meeting-report-reminders
  cancel-in-progress: false
jobs:
  remind:
    if: vars.REPORT_MEETING_REMINDERS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check overdue meeting reports
        env:
          REPORT_CRON_SECRET: ${{ secrets.REPORT_CRON_SECRET }}
        run: |
          if [ -z "$REPORT_CRON_SECRET" ]; then
            echo 'REPORT_CRON_SECRET is required'
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $REPORT_CRON_SECRET" \
            'https://tlc-weekly-report.vercel.app/api/cron/meeting-deadlines'
